[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-analytics"
version = "1.1.0"
description = "Complete Python SDK, CLI, and TUI for Couchbase Enterprise Analytics and Capella Analytics REST APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Ahrendt", email = "cahrendt@github.com" }]
keywords = ["couchbase", "analytics", "enterprise-analytics", "capella", "rest-api", "sdk", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "click>=8.1.7",
    "textual>=0.61.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=4.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pyflakes>=3.2.0",
    "bandit>=1.7.0",
]

[project.scripts]
cb-analytics = "cb_analytics.cli:app"
cb-analytics-gui = "cb_analytics.gui.app:run"

[project.urls]
Repository = "https://github.com/celticht32/Couchbase-Analytics-MCP-Server"
Documentation = "https://github.com/celticht32/Couchbase-Analytics-MCP-Server/blob/main/docs/architecture/ARCHITECTURE.md"
"Bug Tracker" = "https://github.com/celticht32/Couchbase-Analytics-MCP-Server/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cb_analytics = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=cb_analytics --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/cb_analytics"]
omit = ["*/gui/*", "*/cli.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
