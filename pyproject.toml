[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-analytics-mcp"
version = "1.0.0"
description = "Standalone MCP server + GUI for Couchbase Enterprise Analytics and Capella Analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Ahrendt" }]
keywords = ["couchbase", "analytics", "mcp", "claude", "anthropic", "capella"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

dependencies = [
    # MCP server
    "mcp>=1.20.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",

    # HTTP client for Couchbase REST
    "httpx>=0.27.0",
    "tenacity>=8.2.0",

    # Data models
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # GUI
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1.0",  # session signing

    # Observability
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.2",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "bandit[toml]>=1.7.0",
    "pyflakes>=3.2.0",
    "pip-audit>=2.7.0",
    "playwright>=1.42.0",
    "types-PyYAML",
]

[project.scripts]
cb-analytics-mcp = "cb_analytics_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/celticht32/cb-analytics-mcp"
Repository = "https://github.com/celticht32/cb-analytics-mcp"
Issues = "https://github.com/celticht32/cb-analytics-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cb_analytics_mcp = [
    "py.typed",
    "gui/templates/**/*.html",
    "gui/static/**/*",
]

# ── Test config ────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: integration tests (deselect with '-m \"not integration\"')",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/cb_analytics_mcp"]
branch = true
omit = [
    "*/__init__.py",
    "*/__main__.py",
    "*/gui/static/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
precision = 1
show_missing = true

# ── Linters ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "S",     # bandit subset
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # long lines (formatter handles)
    "B008",   # function-call-in-default-argument (FastAPI Depends())
    "S101",   # assert in tests
    "S104",   # bind to all interfaces (legitimate for server)
    "S105",   # hardcoded password (in test fixtures)
    "S106",   # hardcoded password arg (in test fixtures)
    "S311",   # non-crypto randomness (we don't use it for security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S", "B"]
"scripts/**/*" = ["S"]

# ── Type checking ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# ── Security scan ──────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = [
    "B101",  # assert
    "B104",  # bind 0.0.0.0
    "B105",  # hardcoded password string
    "B106",
    "B311",  # random
]
