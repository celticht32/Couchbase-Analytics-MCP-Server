[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-analytics"
version = "1.0.0"
description = "Full Python SDK and GUI for Couchbase Enterprise Analytics REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Ahrendt" }]
copyright = "Copyright (c) 2026 Chris Ahrendt"
keywords = ["couchbase", "analytics", "rest-api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27.0",          # async HTTP client
    "pydantic>=2.7.0",        # data validation and models
    "pydantic-settings>=2.3.0",  # settings management
    "tenacity>=8.3.0",        # retry logic
    "structlog>=24.1.0",      # structured logging
    "rich>=13.7.0",           # console output
    "typer>=0.12.0",          # CLI interface
    "click>=8.1.7",
    "textual>=0.61.0",        # TUI / GUI framework
    "prometheus-client>=0.20.0",  # metrics
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
cb-analytics = "cb_analytics.cli:app"
cb-analytics-gui = "cb_analytics.gui.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=cb_analytics --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/cb_analytics"]
omit = ["*/gui/*", "*/cli.py"]
