{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block layout %}
  <div class="flex min-h-full items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-slate-900">cb-analytics-mcp</h1>
        <p class="mt-2 text-sm text-slate-600">Sign in to the admin GUI</p>
      </div>

      <form method="post" action="/login" class="space-y-4 rounded-lg bg-white p-6 shadow ring-1 ring-slate-200">
        {% if error %}
          <div class="rounded bg-red-50 px-3 py-2 text-sm text-red-700 ring-1 ring-red-200">
            {{ error }}
          </div>
        {% endif %}

        <div>
          <label class="block text-sm font-medium text-slate-700">Username</label>
          <input type="text" name="username" value="{{ username }}" required autofocus
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Password</label>
          <input type="password" name="password" required
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full rounded bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
          Sign in
        </button>

        <p class="text-xs text-slate-500">
          Credentials are configured by the GUI_USERNAME and GUI_PASSWORD environment variables.
        </p>
      </form>
    </div>
  </div>
{% endblock %}
