<text x="54" y="146" fill="#8b949e" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">-- Couchbase Enterprise Analytics SQL++ Console</text>
<text x="54" y="168" fill="#8b949e" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">-- Example: find top airlines by route count</text>
<text x="54" y="190" fill="#e6edf3" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace"></text>
<text x="54" y="212" fill="#58a6ff" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">SELECT</text>
<text x="54" y="234" fill="#e6edf3" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">    a.airlinename,  COUNT(r.id) AS route_count</text>
<text x="54" y="256" fill="#e6edf3" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">FROM `Default`.airline a</text>
<text x="54" y="278" fill="#e6edf3" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">JOIN `Default`.route r ON r.airlineid = a.id</text>
<text x="54" y="300" fill="#e6edf3" font-size="11" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">GROUP BY a.airlinename  ORDER BY route_count DESC  LIMIT 10;</text>
<rect x="54" y="284" width="2" height="18" fill="#e6edf3" stroke="#e6edf3" stroke-width="1" rx="0" opacity="1.0"/>
<rect x="10" y="312" width="980" height="38" fill="#21262d" stroke="#30363d" stroke-width="1" rx="0" opacity="1.0"/>
<rect x="16" y="320" width="80" height="22" fill="#58a6ff" stroke="#58a6ff" stroke-width="1" rx="4" opacity="1.0"/>
<text x="56" y="335" fill="#0d1117" font-size="11" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">▶  Run</text>
<rect x="104" y="320" width="80" height="22" fill="#21262d" stroke="#30363d" stroke-width="1" rx="4" opacity="1.0"/>
<text x="144" y="335" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">⏹  Cancel</text>
<rect x="194" y="320" width="130" height="22" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4" opacity="1.0"/>
<text x="200" y="335" fill="#8b949e" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">not_bounded ▾</text>
<rect x="334" y="320" width="100" height="22" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4" opacity="1.0"/>
<text x="340" y="335" fill="#8b949e" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">timeout...</text>
<text x="700" y="335" fill="#3fb950" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">✓  10 rows  ·  elapsed=42ms  ·  exec=38ms  ·  size=2.1KB</text>
