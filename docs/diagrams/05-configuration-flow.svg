<rect x="50" y="200" width="800" height="380" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="8" opacity="1"/>
<text x="450" y="224" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsClientConfig Fields</text>
<rect x="50" y="234" width="800" height="24" fill="#21262d" stroke="#30363d" stroke-width="1.5" rx="0" opacity="1"/>
<text x="60" y="250" fill="#58a6ff" font-size="10" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Environment Variable</text>
<text x="280" y="250" fill="#58a6ff" font-size="10" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Attribute</text>
<text x="390" y="250" fill="#58a6ff" font-size="10" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Type</text>
<text x="450" y="250" fill="#58a6ff" font-size="10" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Default</text>
<text x="510" y="250" fill="#58a6ff" font-size="10" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Description</text>
<rect x="50" y="260" width="800" height="33" fill="#21262d" stroke="#30363d" stroke-width="1.5" rx="0" opacity="1"/>
<text x="60" y="278" fill="#e3b341" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">CB_ANALYTICS_HOST</text>
<text x="280" y="278" fill="#e6edf3" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">host</text>
<text x="390" y="278" fill="#39d353" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">str</text>
<text x="450" y="278" fill="#3fb950" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">localhost</text>
<text x="510" y="278" fill="#8b949e" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Cluster hostname or IP address</text>
<rect x="50" y="293" width="800" height="33" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="0" opacity="1"/>
<text x="60" y="311" fill="#e3b341" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">CB_ANALYTICS_MGMT_PORT</text>
<text x="280" y="311" fill="#e6edf3" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">mgmt_port</text>
<text x="390" y="311" fill="#39d353" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">int</text>
<text x="450" y="311" fill="#3fb950" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">8091</text>
<text x="510" y="311" fill="#8b949e" font-size="9" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Management API port (18091 for TLS)</text>
