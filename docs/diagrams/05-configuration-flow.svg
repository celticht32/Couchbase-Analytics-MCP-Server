<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="650" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="50" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="0" opacity="1"/>
<text x="450" y="31" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Configuration Sources &amp; Resolution Order</text>
<rect x="50" y="80" width="200" height="90" fill="#21262d" stroke="#d2a8ff" stroke-width="1.5" rx="8" opacity="1"/>
<text x="150" y="104" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">1. Constructor kwargs</text>
<text x="150" y="126" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Highest priority</text>
<text x="150" y="142" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Overrides everything</text>
<rect x="280" y="80" width="200" height="90" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" rx="8" opacity="1"/>
<text x="380" y="104" fill="#58a6ff" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">2. Environment variables</text>
<text x="380" y="126" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">CB_ANALYTICS_* prefix</text>
<text x="380" y="142" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">OS-level or .env file</text>
<rect x="510" y="80" width="200" height="90" fill="#21262d" stroke="#3fb950" stroke-width="1.5" rx="8" opacity="1"/>
<text x="610" y="104" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">3. .env file</text>
<text x="610" y="126" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">python-dotenv</text>
<text x="610" y="142" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">loaded by pydantic-settings</text>
<rect x="740" y="80" width="200" height="90" fill="#21262d" stroke="#8b949e" stroke-width="1.5" rx="8" opacity="1"/>
<text x="840" y="104" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">4. Defaults</text>
<text x="840" y="126" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">localhost:8091/:8095</text>
<text x="840" y="142" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Administrator/password</text>
