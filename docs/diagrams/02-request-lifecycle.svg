<text x="90" y="312" fill="#e3b341" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">4  Retry Logic</text>
<text x="90" y="328" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">tenacity.AsyncRetrying(stop=3, wait=exponential)</text>
<text x="90" y="344" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retries on AnalyticsConnectionError or AnalyticsServerError (5xx)</text>
