<rect x="40" y="598" width="32" height="32" fill="#d2a8ff" stroke="#d2a8ff" stroke-width="1.5" rx="16" opacity="1"/>
<text x="56" y="620" fill="#0d1117" font-size="14" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">8</text>
