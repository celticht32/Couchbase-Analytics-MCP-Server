<text x="90" y="628" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">if response.errors: raise AnalyticsQueryError</text>
<text x="90" y="644" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Maps first error code/msg/line/column into typed exception</text>
