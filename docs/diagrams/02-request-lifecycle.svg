<text x="56" y="695" fill="#0d1117" font-size="14" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">9</text>
<text x="90" y="687" fill="#3fb950" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">9  Return</text>
<text x="90" y="703" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">return AnalyticsQueryResponse</text>
<text x="90" y="719" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Caller receives typed result with .results, .metrics, .warnings</text>
