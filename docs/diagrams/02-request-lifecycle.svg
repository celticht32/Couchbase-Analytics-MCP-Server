<rect x="40" y="448" width="32" height="32" fill="#f78166" stroke="#f78166" stroke-width="1.5" rx="16" opacity="1"/>
<text x="56" y="470" fill="#0d1117" font-size="14" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">6</text>
<text x="90" y="462" fill="#f78166" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">6  Couchbase</text>
<text x="90" y="478" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">POST /api/v1/request</text>
<text x="90" y="494" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">AsterixDB executes SQL++, returns JSON with results, metrics, errors</text>
<line x1="400" y1="505" x2="400" y2="513" stroke="#f78166" stroke-width="2"/>
<polygon points="394,513 406,513 400,520" fill="#f78166"/>
<rect x="30" y="515" width="740" height="65" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="8" opacity="1"/>
<rect x="40" y="523" width="32" height="32" fill="#58a6ff" stroke="#58a6ff" stroke-width="1.5" rx="16" opacity="1"/>
<text x="56" y="545" fill="#0d1117" font-size="14" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">7</text>
<text x="90" y="537" fill="#58a6ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">7  Response Parse</text>
<text x="90" y="553" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AnalyticsQueryResponse.model_validate(raw)</text>
<text x="90" y="569" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Pydantic validates and types all fields (results, metrics, warnings, errors)</text>
