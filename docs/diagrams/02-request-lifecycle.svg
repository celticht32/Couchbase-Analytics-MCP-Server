<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="760" viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg">
<rect width="820" height="760" fill="#0d1117"/>
<rect x="0" y="0" width="820" height="50" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="0" opacity="1"/>
<text x="410" y="31" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Request Lifecycle · v1.1.0 (with Circuit Breaker)</text>
<rect x="20" y="65" width="780" height="55" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="73" width="30" height="30" fill="#d2a8ff" stroke="#d2a8ff" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="93" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">1</text>
<text x="72" y="85" fill="#d2a8ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">1  Caller</text>
<text x="72" y="100" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AnalyticsClient.analytics.execute(AnalyticsQueryRequest(...))</text>
<text x="72" y="113" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">User code, CLI, or TUI passes a Pydantic model</text>
<line x1="410" y1="120" x2="410" y2="128" stroke="#d2a8ff" stroke-width="1.5"/>
<polygon points="404,128 416,128 410,135" fill="#d2a8ff"/>
<rect x="20" y="127" width="780" height="55" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="135" width="30" height="30" fill="#58a6ff" stroke="#58a6ff" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="155" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">2</text>
<text x="72" y="147" fill="#58a6ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">2  Service Layer</text>
<text x="72" y="162" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AnalyticsServiceAPI.execute()</text>
<text x="72" y="175" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Validates model, calls _warn_if_interpolated(), builds JSON payload</text>
<line x1="410" y1="182" x2="410" y2="190" stroke="#58a6ff" stroke-width="1.5"/>
<polygon points="404,190 416,190 410,197" fill="#58a6ff"/>
<rect x="20" y="189" width="780" height="55" fill="#161b22" stroke="#39d353" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="197" width="30" height="30" fill="#39d353" stroke="#39d353" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="217" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">3</text>
<text x="72" y="209" fill="#39d353" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">3  HTTP Client</text>
<text x="72" y="224" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">HttpClient.analytics_post('/api/v1/request', json=payload)</text>
<text x="72" y="237" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Routes to analytics_client (port 8095). Injects Basic Auth header.</text>
<line x1="410" y1="244" x2="410" y2="252" stroke="#39d353" stroke-width="1.5"/>
<polygon points="404,252 416,252 410,259" fill="#39d353"/>
<rect x="20" y="251" width="780" height="55" fill="#161b22" stroke="#e3b341" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="259" width="30" height="30" fill="#e3b341" stroke="#e3b341" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="279" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">4</text>
<text x="72" y="271" fill="#e3b341" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">4  Circuit Breaker</text>
<text x="72" y="286" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">_AsyncCircuitBreaker.call(_do_request)</text>
<text x="72" y="299" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">CLOSED: pass through · OPEN: raise AnalyticsCircuitOpenError immediately · HALF-OPEN: one probe</text>
<line x1="410" y1="306" x2="410" y2="314" stroke="#e3b341" stroke-width="1.5"/>
<polygon points="404,314 416,314 410,321" fill="#e3b341"/>
<rect x="20" y="313" width="780" height="55" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="321" width="30" height="30" fill="#3fb950" stroke="#3fb950" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="341" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">5</text>
<text x="72" y="333" fill="#3fb950" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">5  Retry Logic</text>
<text x="72" y="348" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">tenacity.AsyncRetrying(stop=3, wait=exponential)</text>
<text x="72" y="361" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retries AnalyticsConnectionError + AnalyticsServerError. Circuit-open NOT retried.</text>
<line x1="410" y1="368" x2="410" y2="376" stroke="#3fb950" stroke-width="1.5"/>
<polygon points="404,376 416,376 410,383" fill="#3fb950"/>
<rect x="20" y="375" width="780" height="55" fill="#161b22" stroke="#39d353" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="383" width="30" height="30" fill="#39d353" stroke="#39d353" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="403" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">6</text>
<text x="72" y="395" fill="#39d353" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">6  asyncio.timeout</text>
<text x="72" y="410" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">async with asyncio.timeout(timeout + 5s)</text>
<text x="72" y="423" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Outer guard catches servers that accept connections but never send body</text>
<line x1="410" y1="430" x2="410" y2="438" stroke="#39d353" stroke-width="1.5"/>
<polygon points="404,438 416,438 410,445" fill="#39d353"/>
<rect x="20" y="437" width="780" height="55" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="445" width="30" height="30" fill="#3fb950" stroke="#3fb950" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="465" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">7</text>
<text x="72" y="457" fill="#3fb950" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">7  httpx</text>
<text x="72" y="472" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">httpx.AsyncClient.request('POST', path, json=payload)</text>
<text x="72" y="485" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Async HTTP with per-request Timeout. Basic auth header set at client init.</text>
<line x1="410" y1="492" x2="410" y2="500" stroke="#3fb950" stroke-width="1.5"/>
<polygon points="404,500 416,500 410,507" fill="#3fb950"/>
<rect x="20" y="499" width="780" height="55" fill="#161b22" stroke="#f78166" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="507" width="30" height="30" fill="#f78166" stroke="#f78166" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="527" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">8</text>
<text x="72" y="519" fill="#f78166" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">8  Couchbase</text>
<text x="72" y="534" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">POST /api/v1/request</text>
<text x="72" y="547" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">AsterixDB executes SQL++. Returns JSON: results, metrics, errors.</text>
<line x1="410" y1="554" x2="410" y2="562" stroke="#f78166" stroke-width="1.5"/>
<polygon points="404,562 416,562 410,569" fill="#f78166"/>
<rect x="20" y="561" width="780" height="55" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="569" width="30" height="30" fill="#58a6ff" stroke="#58a6ff" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="589" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">9</text>
<text x="72" y="581" fill="#58a6ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">9  Response Parse</text>
<text x="72" y="596" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AnalyticsQueryResponse.model_validate(raw)</text>
<text x="72" y="609" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Pydantic v2 validates. Metrics, warnings, errors all typed.</text>
<line x1="410" y1="616" x2="410" y2="624" stroke="#58a6ff" stroke-width="1.5"/>
<polygon points="404,624 416,624 410,631" fill="#58a6ff"/>
<rect x="20" y="623" width="780" height="55" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="631" width="30" height="30" fill="#d2a8ff" stroke="#d2a8ff" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="651" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">10</text>
<text x="72" y="643" fill="#d2a8ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">10 Error Check</text>
<text x="72" y="658" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">if response.errors: raise AnalyticsQueryError</text>
<text x="72" y="671" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">First error → code, msg, line, column. Circuit breaker records success.</text>
<line x1="410" y1="678" x2="410" y2="686" stroke="#d2a8ff" stroke-width="1.5"/>
<polygon points="404,686 416,686 410,693" fill="#d2a8ff"/>
<rect x="20" y="685" width="780" height="55" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6" opacity="1"/>
<rect x="28" y="693" width="30" height="30" fill="#3fb950" stroke="#3fb950" stroke-width="1.5" rx="15" opacity="1"/>
<text x="43" y="713" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">11</text>
<text x="72" y="705" fill="#3fb950" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">11 Return</text>
<text x="72" y="720" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">return AnalyticsQueryResponse</text>
<text x="72" y="733" fill="#8b949e" font-size="9" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Caller gets .results, .metrics, .warnings. Prometheus counters updated.</text>
</svg>