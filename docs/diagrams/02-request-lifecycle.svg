<text x="90" y="162" fill="#58a6ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">2  Service Layer</text>
<text x="90" y="178" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AnalyticsServiceAPI.execute()</text>
<text x="90" y="194" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Validates model, builds JSON payload, sets scan_consistency/timeout/args</text>
