<text x="56" y="245" fill="#0d1117" font-size="14" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">3</text>
<text x="90" y="237" fill="#39d353" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">3  HTTP Client</text>
<text x="90" y="253" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">HttpClient.analytics_post('/api/v1/request', json=payload)</text>
<text x="90" y="269" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Routes to analytics_client (port 8095). Adds Basic Auth header.</text>
