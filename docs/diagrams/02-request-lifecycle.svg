<text x="56" y="395" fill="#0d1117" font-size="14" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">5</text>
<text x="90" y="387" fill="#3fb950" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">5  httpx</text>
<text x="90" y="403" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">httpx.AsyncClient.request('POST', path, json=payload)</text>
<text x="90" y="419" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Async HTTP request with configurable timeout</text>
