<text x="90" y="87" fill="#d2a8ff" font-size="12" text-anchor="start" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">1  Caller</text>
<text x="90" y="103" fill="#e6edf3" font-size="10" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AnalyticsClient.analytics.execute(AnalyticsQueryRequest(...))</text>
<text x="90" y="119" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">User code or CLI/TUI passes a Pydantic model</text>
