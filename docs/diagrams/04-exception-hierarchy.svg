<text x="390" y="114" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">(base class)</text>
<rect x="20" y="210" width="155" height="90" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" rx="6" opacity="1"/>
<text x="97" y="236" fill="#58a6ff" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsConnectionError</text>
<text x="97" y="256" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Network/timeout</text>
<text x="97" y="272" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retried automatically</text>
<line x1="390" y1="120" x2="97" y2="210" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="180" y="210" width="155" height="90" fill="#21262d" stroke="#f78166" stroke-width="1.5" rx="6" opacity="1"/>
<text x="257" y="236" fill="#f78166" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsAuthError</text>
<text x="257" y="256" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">401/403</text>
<text x="257" y="272" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Check credentials</text>
<line x1="390" y1="120" x2="257" y2="210" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="340" y="210" width="155" height="90" fill="#21262d" stroke="#e3b341" stroke-width="1.5" rx="6" opacity="1"/>
<text x="417" y="236" fill="#e3b341" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsNotFoundError</text>
<text x="417" y="256" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">404 Not Found</text>
<text x="417" y="272" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Check resource name</text>
<line x1="390" y1="120" x2="417" y2="210" stroke="#e3b341" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="500" y="210" width="155" height="90" fill="#21262d" stroke="#3fb950" stroke-width="1.5" rx="6" opacity="1"/>
<text x="577" y="236" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsRequestError</text>
<text x="577" y="256" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">400/409</text>
<text x="577" y="272" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Fix the request</text>
<line x1="390" y1="120" x2="577" y2="210" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="20" y="360" width="155" height="90" fill="#21262d" stroke="#d2a8ff" stroke-width="1.5" rx="6" opacity="1"/>
