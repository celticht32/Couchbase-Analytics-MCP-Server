<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="560" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg">
<rect width="700" height="560" fill="#0d1117"/>
<rect x="0" y="0" width="700" height="50" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="0" opacity="1"/>
<text x="350" y="31" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Exception Hierarchy</text>
<rect x="250" y="70" width="200" height="50" fill="#21262d" stroke="#f78166" stroke-width="1.5" rx="8" opacity="1"/>
<text x="350" y="100" fill="#f78166" font-size="13" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsError</text>
<text x="350" y="114" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">(base class)</text>
<rect x="30" y="200" width="160" height="90" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" rx="8" opacity="1"/>
<text x="110" y="226" fill="#58a6ff" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsConnectionError</text>
<text x="110" y="246" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Network/timeout</text>
<text x="110" y="262" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retried automatically</text>
<line x1="350" y1="120" x2="110" y2="200" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="180" y="200" width="160" height="90" fill="#21262d" stroke="#f78166" stroke-width="1.5" rx="8" opacity="1"/>
<text x="260" y="226" fill="#f78166" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsAuthError</text>
<text x="260" y="246" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">401 / 403</text>
<text x="260" y="262" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Check credentials</text>
<line x1="350" y1="120" x2="260" y2="200" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="330" y="200" width="160" height="90" fill="#21262d" stroke="#e3b341" stroke-width="1.5" rx="8" opacity="1"/>
<text x="410" y="226" fill="#e3b341" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsNotFoundError</text>
<text x="410" y="246" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">404 Not Found</text>
<text x="410" y="262" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Check resource name</text>
<line x1="350" y1="120" x2="410" y2="200" stroke="#e3b341" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="30" y="330" width="160" height="90" fill="#21262d" stroke="#3fb950" stroke-width="1.5" rx="8" opacity="1"/>
<text x="110" y="356" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsRequestError</text>
<text x="110" y="376" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">400 / 409</text>
<text x="110" y="392" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Fix the request</text>
<line x1="350" y1="120" x2="110" y2="330" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="180" y="330" width="160" height="90" fill="#21262d" stroke="#d2a8ff" stroke-width="1.5" rx="8" opacity="1"/>
<text x="260" y="356" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsServerError</text>
<text x="260" y="376" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">5xx Server Error</text>
<text x="260" y="392" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retried automatically</text>
<line x1="350" y1="120" x2="260" y2="330" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="330" y="330" width="160" height="90" fill="#21262d" stroke="#39d353" stroke-width="1.5" rx="8" opacity="1"/>
<text x="410" y="356" fill="#39d353" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsQueryError</text>
<text x="410" y="376" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">SQL++ error</text>
<text x="410" y="392" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">code, line, column</text>
<line x1="350" y1="120" x2="410" y2="330" stroke="#39d353" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="30" y="450" width="340" height="80" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="8" opacity="1"/>
<text x="200" y="474" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Retry Policy (tenacity)</text>
<text x="200" y="492" fill="#e6edf3" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retried: ConnectionError, ServerError</text>
<text x="200" y="508" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Not retried: Auth, NotFound, Request, Query</text>
<text x="200" y="524" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Backoff: exponential  ·  max_retries=3  ·  ceiling=10s</text>
<rect x="390" y="450" width="280" height="80" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="8" opacity="1"/>
<text x="530" y="474" fill="#58a6ff" font-size="11" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">HTTP Status Mapping</text>
<text x="530" y="492" fill="#8b949e" font-size="9" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HTTP 401  →  AnalyticsAuthError</text>
<text x="530" y="504" fill="#8b949e" font-size="9" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HTTP 403  →  AnalyticsAuthError</text>
<text x="530" y="516" fill="#8b949e" font-size="9" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HTTP 404  →  AnalyticsNotFoundError</text>
<text x="530" y="528" fill="#8b949e" font-size="9" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HTTP 400  →  AnalyticsRequestError</text>
<text x="530" y="540" fill="#8b949e" font-size="9" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HTTP 409  →  AnalyticsRequestError</text>
<text x="530" y="552" fill="#8b949e" font-size="9" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HTTP 5xx  →  AnalyticsServerError</text>
</svg>