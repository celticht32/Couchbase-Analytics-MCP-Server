<text x="97" y="406" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">5xx Server Error</text>
<text x="97" y="422" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retried automatically</text>
<line x1="390" y1="120" x2="97" y2="360" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="180" y="360" width="155" height="90" fill="#21262d" stroke="#39d353" stroke-width="1.5" rx="6" opacity="1"/>
<text x="257" y="386" fill="#39d353" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsQueryError</text>
<text x="257" y="406" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">SQL++ error</text>
<text x="257" y="422" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">code · line · column</text>
<line x1="390" y1="120" x2="257" y2="360" stroke="#39d353" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="340" y="360" width="155" height="90" fill="#21262d" stroke="#e3b341" stroke-width="1.5" rx="6" opacity="1"/>
<text x="417" y="386" fill="#e3b341" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsCircuitOpenError</text>
<text x="417" y="406" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">NEW — circuit open</text>
<text x="417" y="422" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Wait reset_timeout</text>
<line x1="390" y1="120" x2="417" y2="360" stroke="#e3b341" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="500" y="360" width="155" height="90" fill="#21262d" stroke="#f78166" stroke-width="1.5" rx="6" opacity="1"/>
<text x="577" y="386" fill="#f78166" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsLibraryError</text>
<text x="577" y="406" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">NEW — UDF library</text>
<text x="577" y="422" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">remote upload blocked</text>
<line x1="390" y1="120" x2="577" y2="360" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="660" y="360" width="155" height="90" fill="#21262d" stroke="#8b949e" stroke-width="1.5" rx="6" opacity="1"/>
<text x="737" y="386" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">AnalyticsConfigError</text>
<text x="737" y="406" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Config validation</text>
<text x="737" y="422" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">at client init</text>
<line x1="390" y1="120" x2="737" y2="360" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<rect x="20" y="475" width="360" height="90" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="8" opacity="1"/>
<text x="200" y="499" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Retry Policy (tenacity)</text>
<text x="200" y="516" fill="#e6edf3" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Retried: ConnectionError, ServerError</text>
<text x="200" y="531" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">NOT retried: Auth, NotFound, Request, Query</text>
<text x="200" y="546" fill="#e3b341" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Circuit-open: NOT retried — fast-fail</text>
<text x="200" y="561" fill="#8b949e" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">Backoff: exponential · max_retries=3 · ceiling=10s</text>
<rect x="400" y="475" width="360" height="90" fill="#161b22" stroke="#e3b341" stroke-width="1.5" rx="8" opacity="1"/>
<text x="580" y="499" fill="#e3b341" font-size="11" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Circuit Breaker (_AsyncCircuitBreaker)</text>
<text x="580" y="516" fill="#e6edf3" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">CLOSED → counts failures</text>
<text x="580" y="531" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">OPEN → fast-fail after circuit_fail_max (default 5)</text>
<text x="580" y="546" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">HALF-OPEN → one probe after circuit_reset_timeout (30s)</text>
<text x="580" y="561" fill="#3fb950" font-size="9" text-anchor="middle" font-weight="normal" font-family="Inter, Segoe UI, Arial, sans-serif">No Tornado · pure asyncio · Python 3.11/3.12 compatible</text>
</svg>