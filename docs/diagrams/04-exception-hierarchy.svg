<text x="390" y="31" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Exception Hierarchy v1.1.0</text>
<rect x="290" y="70" width="200" height="50" fill="#21262d" stroke="#f78166" stroke-width="1.5" rx="8" opacity="1"/>
