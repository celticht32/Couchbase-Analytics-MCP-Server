#
# On a v* tag push:
#   1. Re-run the full deep-scan as a gate.
#   2. Build sdist + wheel.
#   3. Create a GitHub Release with the matching CHANGELOG section.
#   4. (Optional, manual) publish to PyPI — uncomment the pypi-publish step
#      and create a "pypi" environment in the repo settings.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write       # to create the release
  id-token: write       # for PyPI trusted publishing (if enabled)

jobs:

  gate:
    name: deep-scan gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: bash scripts/deep_scan.sh

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Sanity check artifacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }

      - name: Extract CHANGELOG entry for this tag
        id: changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Pull the section between `## [<tag>]` and the next `## [`
          awk -v ver="$tag" '
            $0 ~ ("^## \\[" ver "\\]") { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "(No CHANGELOG entry found for v$tag — using a placeholder.)" > release_notes.md
          fi
          echo "Notes:"
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false

      # Uncomment to publish to PyPI via trusted publishing
      # (configure under repo Settings → Environments → "pypi" first).
      #
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: dist/
